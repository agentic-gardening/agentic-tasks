version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      eslint:
        patterns: ['eslint', '@eslint/*']
      typescript-eslint:
        patterns: ['@typescript-eslint/*', 'typescript-eslint']
      vitest:
        patterns: ['vitest', '@vitest/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
