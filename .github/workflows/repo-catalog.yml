name: publish catalog

on:
  schedule:
    - cron: '30 5 * * *'
  push:
    branches: [main]
    paths: [packages/agent-repo-catalog/catalog.yaml, packages/agent-repo-catalog/src/**, packages/techdebt-common/src/**, .github/workflows/repo-catalog.yml]
  workflow_dispatch:

concurrency:
  group: agent-repo-catalog
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    # each agent is a package of the monorepo
    working-directory: packages/agent-repo-catalog

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Inspect repositories
        run: node dist/entrypoint.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit repositories.json
        run: |
          git config user.name "techdebt-bot"
          git config user.email "techdebt-bot@users.noreply.github.com"
          git add repositories.json
          git diff --cached --quiet && echo "no change" || git commit -s -m "chore: refresh repositories.json" && git push
