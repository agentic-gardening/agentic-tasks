name: monitor

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths: [packages/agent-pr-monitor/**, packages/techdebt-common/src/**, .github/workflows/pr-monitor.yml]
  workflow_dispatch:

concurrency:
  group: agent-pr-monitor
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

defaults:
  run:
    # each agent is a package of the monorepo
    working-directory: packages/agent-pr-monitor

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Monitor fix pull requests
        run: node dist/entrypoint.js
        env:
          TASKS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_LOGIN: github-actions[bot]
