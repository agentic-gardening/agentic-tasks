name: dispatch

on:
#  schedule:
#    - cron: '0 * * * *'
#  push:
#    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-tasks-dispatcher
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  actions: write

defaults:
  run:
    # each agent is a package of the monorepo
    working-directory: packages/agent-tasks-dispatcher

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Watch tasks and dispatch
        run: node dist/entrypoint.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASKS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVER: benoitf
